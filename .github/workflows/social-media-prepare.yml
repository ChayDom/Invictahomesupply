name: Social media preparation (never publishes)

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: Permanent Product Key (one product; owner Photos only)
        required: false
        type: string
      content_id:
        description: Evergreen Content ID instead of Product Key
        required: false
        type: string
      content_hash:
        description: Immutable renderHash returned by prepareEvergreenSocialQueue
        required: false
        type: string
      reel:
        description: Prepare optional silent Reel (4-6 Photos)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: social-media-${{ inputs.product_key || inputs.content_id }}
  cancel-in-progress: false

jobs:
  prepare:
    # Standard public-repository runner; never a paid larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: social-media
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distro FFmpeg and open font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
      - name: Prepare immutable media only
        env:
          PRODUCT_KEY: ${{ inputs.product_key }}
          CONTENT_ID: ${{ inputs.content_id }}
          CONTENT_HASH: ${{ inputs.content_hash }}
          PREPARE_REEL: ${{ inputs.reel }}
          AIRTABLE_SOCIAL_READ_TOKEN: ${{ secrets.AIRTABLE_SOCIAL_READ_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-media-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ -z "$CONTENT_ID" ] && [ -z "$CONTENT_HASH" ] && [ -n "$PRODUCT_KEY" ] && [ "$PREPARE_REEL" = "true" ]; then
            node scripts/social-media-worker.mjs "$PRODUCT_KEY" --reel
          elif [ -z "$CONTENT_ID" ] && [ -z "$CONTENT_HASH" ] && [ -n "$PRODUCT_KEY" ]; then
            node scripts/social-media-worker.mjs "$PRODUCT_KEY"
          else
            echo "Select exactly one product or evergreen content source."
            exit 1
          fi
