name: Social media preparation (never publishes)

on:
  workflow_dispatch:
    inputs:
      product_key:
        description: Permanent Product Key (one product; owner Photos only)
        required: false
        type: string
      content_id:
        description: Evergreen Content ID instead of Product Key
        required: false
        type: string
      content_hash:
        description: Immutable renderHash returned by prepareEvergreenV2SocialQueue (v2) or prepareEvergreenSocialQueue (v1)
        required: false
        type: string
      evergreen_v2:
        description: Prepare one explicit Evergreen v2 candidate (no approval/status change)
        default: false
        type: boolean
      evergreen_v21:
        description: Prepare one explicit Evergreen v2.1 candidate (no approval/status change)
        default: false
        type: boolean
      evergreen_freeform_test:
        description: Generate one isolated freeform visual experiment asset (no queue/status change)
        default: false
        type: boolean
      evergreen_logo_badge_test:
        description: Generate one isolated freeform asset with a safe corner logo badge (no queue/status change)
        default: false
        type: boolean
      evergreen_logo_safe_area_test:
        description: Generate one isolated freeform asset with safe text margins and a flush top-right logo panel (no queue/status change)
        default: false
        type: boolean
      evergreen_curved_panel_test:
        description: Generate one isolated freeform asset with a flush curved top-right logo panel (no queue/status change)
        default: false
        type: boolean
      reel:
        description: Prepare optional silent Reel (4-6 Photos)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: social-media-${{ inputs.product_key || inputs.content_id }}
  cancel-in-progress: false

jobs:
  prepare:
    # Standard public-repository runner; never a paid larger runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Social-Media
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install distro FFmpeg and open font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
      - name: Verify required media credentials are available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          check_available() {
            if [ -n "$2" ]; then
              echo "$1 available: yes"
            else
              echo "$1 available: no"
              return 1
            fi
          }
          check_available OPENAI_API_KEY "$OPENAI_API_KEY"
          check_available CLOUDINARY_CLOUD_NAME "$CLOUDINARY_CLOUD_NAME"
          check_available CLOUDINARY_API_KEY "$CLOUDINARY_API_KEY"
          check_available CLOUDINARY_API_SECRET "$CLOUDINARY_API_SECRET"
      - name: Prepare immutable media only
        env:
          PRODUCT_KEY: ${{ inputs.product_key }}
          CONTENT_ID: ${{ inputs.content_id }}
          CONTENT_HASH: ${{ inputs.content_hash }}
          EVERGREEN_V2: ${{ inputs.evergreen_v2 }}
          EVERGREEN_V21: ${{ inputs.evergreen_v21 }}
          EVERGREEN_V21_VISUAL_ACCEPTANCE: ${{ inputs.evergreen_v21 }}
          EVERGREEN_FREEFORM_TEST: ${{ inputs.evergreen_freeform_test }}
          EVERGREEN_LOGO_BADGE_TEST: ${{ inputs.evergreen_logo_badge_test }}
          EVERGREEN_LOGO_SAFE_AREA_TEST: ${{ inputs.evergreen_logo_safe_area_test }}
          EVERGREEN_CURVED_PANEL_TEST: ${{ inputs.evergreen_curved_panel_test }}
          PREPARE_REEL: ${{ inputs.reel }}
          AIRTABLE_SOCIAL_READ_TOKEN: ${{ secrets.AIRTABLE_SOCIAL_READ_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "$EVERGREEN_CURVED_PANEL_TEST" = "true" ] && [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-curved-panel-test-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ "$EVERGREEN_LOGO_SAFE_AREA_TEST" = "true" ] && [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-logo-safe-area-test-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ "$EVERGREEN_LOGO_BADGE_TEST" = "true" ] && [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-logo-badge-test-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ "$EVERGREEN_FREEFORM_TEST" = "true" ] && [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-freeform-test-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ "$EVERGREEN_V21" = "true" ] && [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-v21-media-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ "$EVERGREEN_V2" = "true" ] && [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-v2-media-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ -n "$CONTENT_ID" ] && [ -z "$PRODUCT_KEY" ] && [ -n "$CONTENT_HASH" ] && [ "$PREPARE_REEL" != "true" ]; then
            node scripts/evergreen-media-worker.mjs "$CONTENT_ID" "$CONTENT_HASH"
          elif [ -z "$CONTENT_ID" ] && [ -z "$CONTENT_HASH" ] && [ -n "$PRODUCT_KEY" ] && [ "$PREPARE_REEL" = "true" ]; then
            node scripts/social-media-worker.mjs "$PRODUCT_KEY" --reel
          elif [ -z "$CONTENT_ID" ] && [ -z "$CONTENT_HASH" ] && [ -n "$PRODUCT_KEY" ]; then
            node scripts/social-media-worker.mjs "$PRODUCT_KEY"
          else
            echo "Select exactly one product or evergreen content source."
            exit 1
          fi
